# ========================================================
# CUTLOOP Spring Boot Application Configuration
# ========================================================

spring.application.name=CUTLOOP

server.port=8080

# Database Configuration (Default: H2 in-memory/file with full MySQL compatibility mode)
# Switch to 'mysql' profile when local MySQL Community Server is running:
# -Dspring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./cutloop_data;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console for quick table verification)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Constraints
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# CUTLOOP AI Service Integration Endpoint (Python FastAPI)
cutloop.ai.service.url=http://localhost:8000

# Multithreading / Thread Pool Configuration
cutloop.async.core-pool-size=4
cutloop.async.max-pool-size=10
cutloop.async.queue-capacity=50
cutloop.async.thread-name-prefix=CutloopAsync-

# Security & CORS
cutloop.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500
