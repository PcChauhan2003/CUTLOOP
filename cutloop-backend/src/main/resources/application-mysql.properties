# ========================================================
# CUTLOOP MySQL Production/Staging Configuration
# Run with: --spring.profiles.active=mysql
# ========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/cutloop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootpassword

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
